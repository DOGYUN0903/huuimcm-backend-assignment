services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: huuimcm
      MYSQL_USER: huuimcm
      MYSQL_PASSWORD: huuimcm1234
      MYSQL_ROOT_PASSWORD: root1234
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
